services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recall_atlas
      POSTGRES_USER: recall_atlas
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recall_atlas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall_atlas -d recall_atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recall_atlas_postgres:
